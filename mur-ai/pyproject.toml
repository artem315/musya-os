[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mur-ai"
version = "10.0.0b0"
description = "MUR AI Core: tool-using agent for MURCLOUD (Anthropic, OpenAI, OpenRouter)"
authors = [{ name = "ARTYONIX STUDIOS" }]
requires-python = ">=3.11"
dependencies = ["musya-runtime", "musya-service-engine", "anthropic>=2.1", "openai>=1.50"]

[tool.setuptools.packages.find]
include = ["mur_ai*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
