name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Build APKs
        working-directory: android
        env:
          # Optional signing secrets; without them the release APK is unsigned and only the debug APK is installable.
          MUR_KEYSTORE_B64: ${{ secrets.MUR_KEYSTORE_B64 }}
          MUR_KEYSTORE_PASSWORD: ${{ secrets.MUR_KEYSTORE_PASSWORD }}
          MUR_KEY_ALIAS: ${{ secrets.MUR_KEY_ALIAS }}
          MUR_KEY_PASSWORD: ${{ secrets.MUR_KEY_PASSWORD }}
        run: |
          if [ -n "$MUR_KEYSTORE_B64" ]; then echo "$MUR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; export MUR_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"; fi
          ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Source archive
        run: git archive --format=zip --prefix=murcloud-${GITHUB_REF_NAME}/ -o murcloud-${GITHUB_REF_NAME}-source.zip HEAD
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t $IMG:${GITHUB_REF_NAME} -t $IMG:latest .
          docker build -t $IMG-pc:${GITHUB_REF_NAME} remote-desktop/
          docker push $IMG:${GITHUB_REF_NAME} && docker push $IMG:latest && docker push $IMG-pc:${GITHUB_REF_NAME}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            murcloud-*-source.zip
