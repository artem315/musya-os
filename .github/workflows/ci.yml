name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Runtime, Service Engine, MUR AI, Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: murcloud
          POSTGRES_PASSWORD: murcloud-test
          POSTGRES_DB: murcloud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U murcloud" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: |
          pip install -e musya-runtime -e service-engine -e mur-ai -e "backend[s3,pc,test]" ruff
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check --select E9,F63,F7,F82 musya-runtime service-engine mur-ai backend
      - name: MUSYA Runtime tests
        run: pytest -q musya-runtime/tests
      - name: Service Engine tests (real Chromium)
        run: pytest -q service-engine/tests
      - name: MUR AI tests
        run: pytest -q mur-ai/tests
      - name: Backend tests (SQLite)
        working-directory: backend
        run: pytest -q
      - name: Backend tests (PostgreSQL)
        working-directory: backend
        env:
          MUR_TEST_DATABASE_URL: postgresql://murcloud:murcloud-test@127.0.0.1:5432/murcloud_test
        run: pytest -q tests/test_api.py
      - name: Validate example manifests
        run: |
          for f in examples/*.driver examples/*.yml packages/*/*.driver packages/*/app.yml; do python -m musya_runtime validate "$f"; done
          python -m musya_runtime test examples/hello.mysya

  frontend:
    name: Desktop UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  e2e:
    name: Browser end-to-end (readiness criteria)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - run: |
          pip install -e musya-runtime -e service-engine -e mur-ai -e "backend[test]"
          python -m playwright install --with-deps chromium
      - name: Start MURCLOUD
        working-directory: backend
        env:
          MUR_DATA_DIR: ${{ runner.temp }}/murdata
          MUR_FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
          MUR_AI_ALLOW_SCRIPTED: "1"
        run: |
          nohup uvicorn --factory app.main:get_app --host 127.0.0.1 --port 8000 > ${{ runner.temp }}/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Run e2e
        env:
          MUR_E2E_URL: http://127.0.0.1:8000
          MUR_E2E_SHOTS: e2e-shots
        run: pytest -q e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build, unit-test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: murcloud-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build MURCLOUD image
        run: docker build -t murcloud/murcloud:ci .
      - name: Build MUR PC image
        run: docker build -t murcloud/mur-pc:10.0 remote-desktop/
      - name: Smoke test container
        run: |
          docker run -d --name mur -p 8000:8000 -e MUR_DATA_DIR=/data murcloud/murcloud:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/ | grep -q MURCLOUD
      - name: MUR PC integration test
        run: |
          pip install -e musya-runtime -e service-engine -e mur-ai -e "backend[pc,test]"
          python -m playwright install chromium
          cd backend && pytest -q tests/test_pc.py
