# Render Blueprint: backend web service (Docker) + PostgreSQL + persistent disk.
# MUR PC is not available on Render (no Docker-in-Docker) - see remote-desktop/README.md.
services:
  - type: web
    name: murcloud
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # Chromium needs >= 2 GB RAM
    healthCheckPath: /api/health
    disk:
      name: murcloud-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: MUR_ENV
        value: production
      - key: MUR_COOKIE_SECURE
        value: "1"
      - key: MUR_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: murcloud-db
          property: connectionString
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: MUR_REGISTRATION_OPEN
        value: "1"
      - key: MUR_AI_KEY
        sync: false           # optional operator key, set in the Render dashboard
      - key: MUR_PC_ENABLED
        value: "0"

databases:
  - name: murcloud-db
    databaseName: murcloud
    user: murcloud
    plan: basic-256mb
