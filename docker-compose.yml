# MURCLOUD on a VPS: PostgreSQL + backend + Caddy (automatic HTTPS).
#   cp .env.example .env   # fill MUR_DOMAIN, MUR_SECRET_KEY, POSTGRES_PASSWORD
#   docker compose up -d --build
# MUR PC (remote Linux desktops) additionally:
#   docker build -t murcloud/mur-pc:10.0 remote-desktop/
#   docker compose -f docker-compose.yml -f docker-compose.pc.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: murcloud
      POSTGRES_DB: murcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murcloud"]
      interval: 5s
      retries: 20

  backend:
    build: .
    image: murcloud/murcloud:10.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MUR_ENV: production
      MUR_COOKIE_SECURE: "1"
      MUR_SECRET_KEY: ${MUR_SECRET_KEY:?set MUR_SECRET_KEY in .env}
      DATABASE_URL: postgresql+asyncpg://murcloud:${POSTGRES_PASSWORD}@db:5432/murcloud
      MUR_REGISTRATION_OPEN: ${MUR_REGISTRATION_OPEN:-1}
      MUR_AI_PROVIDER: ${MUR_AI_PROVIDER:-anthropic}
      MUR_AI_KEY: ${MUR_AI_KEY:-}
      MUR_AI_MODEL: ${MUR_AI_MODEL:-}
      MUR_STORAGE: ${MUR_STORAGE:-local}
      MUR_S3_BUCKET: ${MUR_S3_BUCKET:-}
      MUR_S3_ENDPOINT: ${MUR_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FORWARDED_ALLOW_IPS: "*"   # only Caddy can reach the backend (no published port)
    volumes:
      - murdata:/data
    shm_size: "1gb"            # Chromium
    mem_limit: 4g
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      MUR_DOMAIN: ${MUR_DOMAIN:?set MUR_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  murdata:
  caddy_data:
  caddy_config:
