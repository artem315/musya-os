[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musya-service-engine"
version = "10.0.0b0"
description = "MUSYA Service Engine: queued, permission-checked browser automation (Playwright/Chromium)"
authors = [{ name = "ARTYONIX STUDIOS" }]
requires-python = ">=3.11"
dependencies = ["musya-runtime", "playwright>=1.48", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["service_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
testpaths = ["tests"]
