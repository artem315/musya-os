*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,Arial,sans-serif}body{background:#10121a;display:flex;align-items:flex-start;justify-content:center;padding:22px 10px}.iui-page{width:390px;height:670px;max-width:100%;position:relative;overflow:hidden;background:#f6f7fb;box-shadow:0 16px 50px #0004}.iui-el{position:absolute;display:flex;align-items:center;justify-content:center;white-space:pre-wrap;word-break:break-word;overflow:hidden;text-align:center;box-sizing:border-box}.iui-el[hidden]{display:none!important}.iui-text{display:flex;align-items:center;justify-content:center;width:100%;height:100%;overflow:hidden;white-space:pre-wrap;padding:0 3px}.iui-btn{cursor:pointer;font:inherit;transition:filter .15s,transform .15s}.iui-btn:active{transform:scale(.96);filter:brightness(.85)}.iui-progress-fill{height:100%;display:block;min-width:0;transition:width .18s ease}.iui-el input{width:100%;height:100%;font:inherit;border:0;outline:none;background:transparent;padding:0 12px;color:inherit}.iui-el img{width:100%;height:100%;object-fit:cover}.iui-bounce{animation:iui-pop .7s both}@keyframes iui-fade{from{opacity:0}to{opacity:1}}@keyframes iui-slide-up{from{opacity:0;transform:translateY(45px)}to{opacity:1;transform:translateY(0)}}@keyframes iui-slide-left{from{opacity:0;transform:translateX(-45px)}to{opacity:1;transform:translateX(0)}}@keyframes iui-zoom{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}@keyframes iui-pop{0%{transform:scale(.6);opacity:0}65%{transform:scale(1.11);opacity:1}100%{transform:scale(1)}}@keyframes iui-pulse{50%{transform:scale(1.06)}}@keyframes iui-float{50%{transform:translateY(-12px)}}@keyframes iui-spin{to{transform:rotate(360deg)}}@keyframes iui-glow{50%{box-shadow:0 0 30px #9979ff}}@media(max-width:420px){body{padding:0}.iui-page{flex:none;transform-origin:top center;max-width:none}}

<script>
(function exportedRuntime(){
 const data=JSON.parse(document.getElementById('iui-data').textContent);
 const elements=data.items;
 const byId=id=>document.querySelector('[data-ui-id="'+id+'"]');
 const getItem=id=>elements.find(i=>String(i.id)===String(id));
 const getFill=id=>{let el=byId(id);return el?.querySelector('.iui-progress-fill')};
 const sizing=()=>{const page=document.querySelector('.iui-page');if(page)page.style.zoom=Math.min(1,Math.max(.2,(window.innerWidth-20)/data.width))};window.addEventListener('resize',sizing);sizing();
 const original={};elements.forEach(e=>original[e.id]={value:e.value,text:e.text,hidden:e.hidden});
 const running=new Map();
 const pending=new Map();
 function stopProgress(id){const k=String(id);if(running.has(k)){cancelAnimationFrame(running.get(k));running.delete(k)}if(pending.has(k)){clearTimeout(pending.get(k));pending.delete(k)}}
 const ease=t=>1-Math.pow(1-t,3);
 function updateLinked(id){elements.filter(x=>x.type==='text'&&String(x.progressLink||'')===String(id)).forEach(x=>{const label=byId(x.id)?.querySelector('.iui-text');const source=getItem(id);if(label&&source)label.textContent=String(x.progressPrefix||'')+Math.round(Number(source.value)||0)+String(x.progressSuffix??'%')})}
 function setValue(id,value){const e=getItem(id),bar=getFill(id);if(!e||!bar)return;value=Math.max(0,Math.min(100,Number(value)||0));e.value=value;bar.style.width=value+'%';let label=byId(id)?.querySelector('.iui-progress-num');if(label)label.textContent=Math.round(value)+'%';updateLinked(id)}
 function animateProgress(id,target,duration){const e=getItem(id);if(!e||e.type!=='progress')return;stopProgress(id);const k=String(id);target=Math.max(0,Math.min(100,Number(target)||0));duration=Math.max(100,Number(duration)||1000);const start=Number(e.value)||0,begin=performance.now();function tick(now){const t=Math.min(1,(now-begin)/duration);setValue(id,start+(target-start)*ease(t));if(t<1)running.set(k,requestAnimationFrame(tick));else running.delete(k)}running.set(k,requestAnimationFrame(tick))}
 function runSingleAction(button){let a=button.action||'none',target=button.target,val=button.actionValue??'';const node=byId(target),item=getItem(target);
 if(a==='alert')alert(val||'ОКАК! 😎');
 else if(a==='setProgress'){stopProgress(target);setValue(target,val)}
 else if(a==='animateProgress')animateProgress(target,val,button.speed||1500);
 else if(a==='addProgress'&&item&&item.type==='progress'){stopProgress(target);setValue(target,(Number(item.value)||0)+(Number(val)||0))}
 else if(a==='setText'&&node){let label=node.querySelector('.iui-text');if(label){label.textContent=val;if(item)item.text=val}}
 else if(a==='count'&&node){let label=node.querySelector('.iui-text');if(label){let n=Number(label.textContent.trim());label.textContent=(Number.isFinite(n)?n:0)+1;if(item)item.text=label.textContent}}
 else if(a==='toggle'&&node){node.hidden=!node.hidden}
 else if(a==='link'&&/^https?:\/\//i.test(val)){window.open(val,'_blank','noopener,noreferrer')}
 else if(a==='reset'){running.forEach(n=>cancelAnimationFrame(n));running.clear();pending.forEach(n=>clearTimeout(n));pending.clear();elements.forEach(e=>{const o=original[e.id],el=byId(e.id);if(!el)return;el.hidden=!!o.hidden;if(e.type==='progress')setValue(e.id,o.value);let lbl=el.querySelector('.iui-text');if(lbl)lbl.textContent=o.text??''})}
 }
 function runAction(button){const actions=Array.isArray(button.actions)?button.actions:[button];actions.forEach(a=>runSingleAction(a))}
 elements.forEach(e=>{if(e.type==='progress')updateLinked(e.id)});
 elements.forEach(e=>{const el=byId(e.id);if(!el)return;if(e.type==='button')el.addEventListener('click',()=>runAction(e));if(e.type==='progress'&&e.auto){const goal=e.value;setValue(e.id,e.start??0);pending.set(String(e.id),setTimeout(()=>{pending.delete(String(e.id));animateProgress(e.id,goal,e.speed||1700)},120+Number(e.animDelay||0)))}});
})();
</script>
