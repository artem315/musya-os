[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murcloud-backend"
version = "10.0.0b0"
description = "MURCLOUD 10 000 ULTRA backend (FastAPI)"
authors = [{ name = "ARTYONIX STUDIOS" }]
requires-python = ">=3.11"
dependencies = [
  "musya-runtime", "musya-service-engine", "mur-ai",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.29", "aiosqlite>=0.20",
  "python-multipart>=0.0.9", "cryptography>=42", "psutil>=5.9", "httpx>=0.27", "websockets>=12", "pyyaml>=6",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
pc = ["docker>=7"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "moto[s3]>=5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
