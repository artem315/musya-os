[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musya-runtime"
version = "10.0.0b0"
description = "MUSYA language runtime (lexer, parser, interpreter) for MURCLOUD OS"
authors = [{ name = "ARTYONIX STUDIOS" }]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
musya = "musya_runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["musya_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
